name: Build KillhausMonitor

# Собирает плагин под АКТУАЛЬНЫЙ hl2sdk-cs2 (решает проблему undefined symbol:
# клонирует свежие metamod-source + hl2sdk на каждый запуск). Артефакт — zip с
# addons/ (PlayersInfo-совместимый бинарник KillhausMonitor.so + .vdf).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
  release:
    types: [ created ]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qy
          apt-get install -y git clang-10 clang++-10 binutils python3 python3-pip zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          git clone https://github.com/alliedmodders/ambuild.git ambuild
          cd ambuild && pip3 install . && cd ..

          mkdir -p external
          cd external
          git clone https://github.com/alliedmodders/metamod-source.git
          git -C metamod-source checkout 7ec0f16948ab3a0910a98b4ac10e1c0e360d5339
          git -C metamod-source submodule update --init --recursive
          # hl2sdk cs2 HEAD (#427) broke public/vscript/ivscript.h
          # ('ScriptClassDesc_t' does not name a type). #426 is the newest
          # commit that builds and already has the post-update vtable fixes.
          git clone https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 checkout aeaa10b6dbbe9898d47db03c9dcf336528623ce9
          git -C hl2sdk-cs2 submodule update --init --recursive
          cd ..

          # SchemaEntity — рядом с репозиторием (AMBuilder ссылается на ../SchemaEntity)
          cd ..
          git clone https://github.com/Pisex/SchemaEntity.git
          cd "$GITHUB_WORKSPACE"

      - name: Configure and build
        run: |
          mkdir build && cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" --hl2sdk-root="$HL2SDK_ROOT"
          ambuild

      - name: Package addon into ZIP
        run: |
          cd build/package/addons
          zip -r "KillhausMonitor.zip" .
          mv "KillhausMonitor.zip" "${GITHUB_WORKSPACE}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KillhausMonitor
          path: ${{ github.workspace }}/KillhausMonitor.zip
